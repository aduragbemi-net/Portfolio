{% extends 'base.html' %}
{% block title %}Manage Courses - FeedbackHub{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Manage Courses</h1>
        <a href="{% url 'feedback:create_course' %}" class="btn btn-primary">+ Add Course</a>
    </div>
    <div class="card">
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Code</th><th>Name</th><th>Lecturer</th><th>Actions</th></tr></thead>
                <tbody>
                {% for course in courses %}
                <tr>
                    <td>{{ course.code }}</td>
                    <td>{{ course.name }}</td>
                    <td>{{ course.lecturer.get_full_name }}</td>
                    <td>
                        <a href="{% url 'feedback:edit_course' course.pk %}" class="btn btn-outline btn-sm">Edit</a>
                        <a href="{% url 'feedback:delete_course' course.pk %}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
